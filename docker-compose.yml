services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: creozentic
      POSTGRES_PASSWORD: creozentic
      POSTGRES_DB: creozentic
    ports: ["5432:5432"]
    volumes: ["postgres-data:/var/lib/postgresql/data"]
  redis:
    image: redis:7-alpine
    ports: ["6379:6379"]
  api:
    build: .
    command: ["pnpm", "--filter", "@creozentic/api", "start"]
    depends_on: [postgres, redis]
    environment:
      DATABASE_URL: postgresql://creozentic:creozentic@postgres:5432/creozentic
      REDIS_URL: redis://redis:6379
      NODE_ENV: production
      RUN_API: "true"
    ports: ["4000:4000"]
  web:
    build: .
    command: ["node", "server.js"]
    depends_on: [postgres, redis]
    environment:
      DATABASE_URL: postgresql://creozentic:creozentic@postgres:5432/creozentic
      REDIS_URL: redis://redis:6379
      NODE_ENV: production
    ports: ["3000:3000"]
  worker:
    build: .
    command: ["node", "worker.js"]
    depends_on: [postgres, redis]
    environment:
      DATABASE_URL: postgresql://creozentic:creozentic@postgres:5432/creozentic
      REDIS_URL: redis://redis:6379
      NODE_ENV: production
volumes:
  postgres-data:
