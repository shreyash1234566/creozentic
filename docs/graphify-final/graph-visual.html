<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Creozentic Visual Knowledge Graph</title><script src="https://unpkg.com/vis-network/standalone/umd/vis-network.min.js"></script><style>html,body{height:100%;margin:0;background:#09111f;color:#e6edf7;font:14px system-ui}header{height:70px;padding:12px 18px;box-sizing:border-box;background:#101b30;border-bottom:1px solid #2c3b60}h1{margin:0;color:#5eead4;font-size:21px}.muted{color:#9eacc5;font-size:12px}.layout{height:calc(100vh - 70px);min-height:0;display:grid;grid-template-columns:1fr 320px;overflow:hidden}#graph{background:#07101d;position:relative;height:100%;min-height:0;overflow:hidden}.panel{background:#121a2e;border-left:1px solid #2c3b60;padding:14px;overflow:auto}button,input,select{box-sizing:border-box;width:100%;padding:9px;margin:4px 0;border:1px solid #2c3b60;border-radius:7px;background:#0d1528;color:#e6edf7;font:inherit}button{color:#5eead4;cursor:pointer}.stat{display:inline-block;background:#18233d;border-radius:7px;padding:7px;margin:2px;font-size:12px}.stat b{color:#5eead4;font-size:16px}.nodeinfo{border-top:1px solid #2c3b60;margin-top:12px;padding-top:10px;overflow-wrap:anywhere}.legend span{display:inline-block;padding:3px 6px;border-radius:99px;margin:2px;background:#203452;font-size:11px}@media(max-width:800px){.layout{grid-template-columns:1fr}.panel{position:absolute;right:0;top:70px;width:290px;height:calc(100% - 70px);z-index:4;box-shadow:-5px 0 20px #0008}#graph{height:calc(100vh - 70px)}}</style></head><body><header><h1>Creozentic Visual Knowledge Graph</h1><div class="muted">Whole project overview: each circle is a real source group. Click a circle to open its real code nodes and edges. Drag, zoom, and pan the graph.</div></header><div class="layout"><div id="graph"></div><aside class="panel"><div id="stats"><span class="stat"><b>—</b> nodes</span></div><button id="overviewBtn">Whole project overview</button><input id="search" placeholder="Search a node, file, worker..."><button id="searchBtn">Find and show matches</button><select id="repo"><option value="">Select repository to expand</option></select><button id="expandBtn">Open selected repository graph</button><div class="legend"><span>Repository</span><span>Code node</span><span>File</span></div><div id="status" class="muted">Loading visual graph…</div><div id="nodeinfo" class="nodeinfo">Click a graph node to inspect it.</div></aside></div><script>
let network = null;
const $ = id => document.getElementById(id);
const esc = value => String(value ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
async function api(path) { const response = await fetch(path); if (!response.ok) throw Error(await response.text()); return response.json(); }
function showNode(id, nodes, links) { const node = nodes.find(item => item.id === id) || {}; const related = links.filter(edge => (edge.from || edge.source) === id || (edge.to || edge.target) === id).slice(0, 50); $('nodeinfo').innerHTML = '<h3>' + esc(node.label || node.id) + '</h3><div class="muted">' + esc(node.repo || '') + '<br>' + esc(node.source_file || '') + ' ' + esc(node.source_location || '') + '</div><p>Visible connections: ' + related.length + '</p>'; }
function draw(data, mode) {
  const nodeItems = data.nodes.map(node => ({ id: node.id, label: node.label || node.id, title: (node.repo || '') + '\n' + (node.source_file || ''), shape: 'dot', size: mode === 'overview' ? Math.max(18, Math.min(65, 12 + Math.log10((node.nodes || 1) + 1) * 18)) : 10, color: mode === 'overview' ? {background:'#14b8a6', border:'#99f6e4'} : {background: node.group === 'file' ? '#fbbf24' : '#60a5fa', border:'#dbeafe'}, font:{color:'#e6edf7', size: mode === 'overview' ? 14 : 10} }));
  const edgeItems = data.links.map((edge, index) => ({ id:index, from:edge.from || edge.source, to:edge.to || edge.target, label:edge.label || '', arrows:'to', width:mode === 'overview' ? Math.max(1, Math.min(8, Math.log10((edge.value || 1) + 1))) : 1, color:{color:'#476486', opacity:.7}, font:{color:'#9eacc5', size:9, strokeWidth:0} }));
  if (network) network.destroy();
  network = new vis.Network($('graph'), {nodes:new vis.DataSet(nodeItems), edges:new vis.DataSet(edgeItems)}, {autoResize:true, physics:{enabled:true, stabilization:{iterations:300}}, interaction:{hover:true, navigationButtons:true, keyboard:true}, nodes:{borderWidth:1}, edges:{smooth:{type:'dynamic'}}});
  network.on('click', params => { if (params.nodes.length) showNode(params.nodes[0], data.nodes, data.links); });
  network.once('stabilizationIterationsDone', () => network.fit({animation:false}));
  setTimeout(() => network.fit({animation:false}), 500);
  $('status').textContent = mode === 'overview' ? 'Whole-project repository graph loaded. Click a repository circle to drill down.' : 'Showing ' + (data.shownNodes || data.nodes.length) + ' real nodes and ' + (data.shownEdges || data.links.length) + ' real edges.';
}
async function overview() { try { const data = await api('/api/overview'); draw(data, 'overview'); $('stats').innerHTML = '<span class="stat"><b>' + data.nodes.length + '</b> source groups</span><span class="stat"><b>' + data.links.length + '</b> cross-source connections</span>'; } catch (error) { $('status').textContent = error.message; } }
async function expandRepo() { const repo = $('repo').value; if (!repo) return; try { const data = await api('/api/repo-graph?repo=' + encodeURIComponent(repo) + '&limit=2500'); draw(data, 'repo'); $('stats').innerHTML = '<span class="stat"><b>' + data.totalNodes.toLocaleString() + '</b> total nodes</span><span class="stat"><b>' + data.shownNodes.toLocaleString() + '</b> shown</span><span class="stat"><b>' + data.shownEdges.toLocaleString() + '</b> edges</span>'; } catch (error) { $('status').textContent = error.message; } }
async function searchNodes() { const query = $('search').value.trim(); if (!query) return; try { const data = await api('/api/search?q=' + encodeURIComponent(query) + '&limit=100'); const nodes = data.results.map(node => ({id:node.id, label:node.label || node.id, repo:node.repo, source_file:node.source_file, group:node.file_type || 'node'})); draw({nodes:nodes, links:[]}, 'repo'); $('stats').innerHTML = '<span class="stat"><b>' + nodes.length + '</b> matching nodes</span>'; } catch (error) { $('status').textContent = error.message; } }
async function init() { try { const stats = await api('/api/stats'); stats.repos.forEach(repo => { const option = document.createElement('option'); option.value = repo; option.textContent = repo; $('repo').appendChild(option); }); await overview(); } catch (error) { $('status').textContent = 'Graph API error: ' + error.message; } }
$('overviewBtn').onclick = overview; $('expandBtn').onclick = expandRepo; $('searchBtn').onclick = searchNodes; $('search').onkeydown = event => { if (event.key === 'Enter') searchNodes(); }; init();
</script></body></html>
